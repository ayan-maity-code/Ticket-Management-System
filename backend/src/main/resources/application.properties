spring.application.name=support-ticket-backend

server.port=${PORT:8080}

# Comma-separated browser origins (Netlify URL, local Vite, etc.)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# File-based H2 (data survives restart under ./data/). Only one embedded JVM should own the file;
# AUTO_SERVER helps if a second process connects after the server is up. Stop old bootRun first.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/support_ticket;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;AUTO_SERVER=TRUE;LOCK_TIMEOUT=10000;NON_KEYWORDS=TEXT}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.error.include-message=never
server.error.include-stacktrace=never
