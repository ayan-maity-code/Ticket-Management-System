# Optional: Render Blueprint — import from repo with root directory "backend"
services:
  - type: web
    name: support-ticket-api
    runtime: java
    rootDir: backend
    buildCommand: ./gradlew build -x test
    startCommand: java -jar build/libs/support-ticket-backend-0.0.1-SNAPSHOT.jar
    envVars:
      - key: JAVA_VERSION
        value: "21"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DB_URL
        value: jdbc:h2:file:./data/support_ticket;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;AUTO_SERVER=TRUE;LOCK_TIMEOUT=10000;NON_KEYWORDS=TEXT
